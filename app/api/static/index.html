<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Workspace</title>
<style>
:root {
  --bg: #f7f8fa; --panel: #ffffff; --panel-2: #f0f2f5; --border: #e3e6ea;
  --text: #16191d; --muted: #6b7280; --faint: #9aa1ab;
  --accent: #3d5afe; --accent-soft: #eaeeff;
  --human: #0f766e; --agent: #6d28d9;
  --todo: #94a3b8; --progress: #3b82f6; --review: #f59e0b; --done: #10b981;
  --shadow: 0 1px 2px rgba(16,25,45,.06), 0 4px 12px rgba(16,25,45,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a; --panel: #1b1e24; --panel-2: #22262d; --border: #2c313a;
    --text: #e6e8eb; --muted: #9aa1ab; --faint: #6b7280;
    --accent: #7c8cff; --accent-soft: #232a45;
    --human: #2dd4bf; --agent: #c4b5fd;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
        "Noto Sans KR", "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text);
  display: grid; grid-template-columns: 232px minmax(0, 1fr) 320px;
  /* dvh: 모바일 브라우저 주소창이 접힐 때 100vh 가 틀리는 문제를 피한다 */
  height: 100dvh; max-height: 100dvh; overflow: hidden;
}
/* ★ grid/flex 아이템은 기본 min-height 가 auto 라 내용만큼 늘어난다.
   이걸 0 으로 내려야 자식(#feed)이 넘칠 때 부모가 커지는 대신 자식이 스크롤한다.
   빠뜨리면 메시지가 쌓일수록 입력창이 화면 밖으로 밀려난다. */
aside, .board, main { min-height: 0; }
aside, .board { background: var(--panel); overflow-y: auto; }
aside { border-right: 1px solid var(--border); }
.board { border-left: 1px solid var(--border); }
main { display: flex; flex-direction: column; min-width: 0; }

.sec { padding: 14px 14px 6px; font-size: 11px; font-weight: 700;
       letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.row { display: flex; align-items: center; gap: 8px; padding: 7px 14px;
       cursor: pointer; border-left: 2px solid transparent; }
.row:hover { background: var(--panel-2); }
.row.on { background: var(--accent-soft); border-left-color: var(--accent); }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.human { background: var(--human); }
.dot.agent { background: var(--agent); }
.tag { font-size: 10px; color: var(--faint); border: 1px solid var(--border);
       border-radius: 4px; padding: 0 4px; flex: none; }

header { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 20px;
         border-bottom: 1px solid var(--border); background: var(--panel); }
header h1 { font-size: 15px; font-weight: 700; }
header .topic { color: var(--muted); font-size: 12px; flex: 1;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--done);
          animation: pulse 2s infinite; }
.live.off i { background: var(--faint); animation: none; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

#feed { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
        padding: 18px 20px 8px; scroll-behavior: smooth; }
.msg { display: flex; gap: 10px; padding: 7px 0; }
.msg .av { width: 30px; height: 30px; border-radius: 8px; flex: none; display: grid;
           place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
.msg .bd { min-width: 0; flex: 1; }
.msg .hd { display: flex; align-items: baseline; gap: 8px; margin-bottom: 1px; }
.msg .who { font-weight: 700; font-size: 13px; }
.msg .ts { font-size: 11px; color: var(--faint); }
.msg .tx { white-space: pre-wrap; word-break: break-word; }
.msg .tx .mention { color: var(--accent); font-weight: 600; }
.msg.d1 { margin-left: 26px; } .msg.d2 { margin-left: 52px; } .msg.d3 { margin-left: 78px; }
.msg.thr { margin-left: 40px; border-left: 2px solid var(--border); padding-left: 12px; }
.msg.thr .av { width: 22px; height: 22px; font-size: 10px; border-radius: 6px; }
.hint { color: var(--faint); font-size: 12px; padding: 4px 0 4px 40px; }

#working { flex: none; padding: 0 20px 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: flex; align-items: center; gap: 6px; font-size: 12px;
        background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 99px; padding: 3px 10px; color: var(--muted); }
.chip .d { display: flex; gap: 2px; }
.chip .d s { width: 3px; height: 3px; border-radius: 50%; background: var(--accent);
             animation: bounce 1.2s infinite; text-decoration: none; }
.chip .d s:nth-child(2) { animation-delay: .15s }
.chip .d s:nth-child(3) { animation-delay: .3s }
@keyframes bounce { 0%,60%,100% { opacity: .25 } 30% { opacity: 1 } }

form { flex: none; position: relative; display: flex; gap: 8px; padding: 12px 20px 16px;
       border-top: 1px solid var(--border); background: var(--panel); }

/* @멘션 자동완성 */
#mention { position: absolute; left: 20px; right: 20px; bottom: calc(100% - 6px);
           max-height: 236px; overflow-y: auto; z-index: 20;
           background: var(--panel); border: 1px solid var(--border);
           border-radius: 10px; box-shadow: var(--shadow); padding: 4px; }
#mention[hidden] { display: none; }
#mention .opt { display: flex; align-items: center; gap: 8px; padding: 7px 10px;
                border-radius: 7px; cursor: pointer; }
#mention .opt.sel { background: var(--accent-soft); }
#mention .opt .nm { font-weight: 600; flex: none; }
#mention .opt .ro { color: var(--muted); font-size: 12px; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
#mention .opt mark { background: none; color: var(--accent); font-weight: 700; }
#mention .tip { padding: 5px 10px 3px; font-size: 11px; color: var(--faint);
                border-top: 1px solid var(--border); margin-top: 4px; }
textarea { flex: 1; resize: none; font: inherit; color: var(--text);
           background: var(--panel-2); border: 1px solid var(--border);
           border-radius: 10px; padding: 9px 12px; min-height: 42px; max-height: 140px; }
textarea:focus { outline: none; border-color: var(--accent); }
button { font: inherit; font-weight: 600; color: #fff; background: var(--accent);
         border: 0; border-radius: 10px; padding: 0 18px; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }

.col { padding: 10px 14px; }
.col h3 { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
          color: var(--faint); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.col h3 b { width: 6px; height: 6px; border-radius: 50%; }
.col h3 em { font-style: normal; color: var(--faint); font-weight: 500; }
.card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px;
        padding: 9px 11px; margin-bottom: 7px; box-shadow: var(--shadow); }
.card .t { font-size: 13px; line-height: 1.45; margin-bottom: 5px; }
.card .m { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.empty { color: var(--faint); font-size: 12px; padding: 2px 0 6px; }
.err { flex: none; margin: 10px 20px; padding: 9px 12px; border-radius: 8px; font-size: 12px;
       background: #fee; color: #a33; border: 1px solid #fbb; }

/* 좁은 창(브라우저 패널 등)에서는 보드와 사이드바를 접는다 */
@media (max-width: 1100px) {
  body { grid-template-columns: 200px minmax(0, 1fr); }
  .board { display: none; }
}
@media (max-width: 720px) {
  body { grid-template-columns: minmax(0, 1fr); }
  aside { display: none; }
}
@media (prefers-color-scheme: dark) { .err { background: #3a1f22; color: #f9a; border-color: #5a2f33; } }
</style>
</head>
<body>

<aside>
  <div class="sec">채널</div>
  <div id="channels"></div>
  <div class="sec">멤버</div>
  <div id="members"></div>
</aside>

<main>
  <header>
    <h1 id="chName">—</h1>
    <span class="topic" id="chTopic"></span>
    <span class="live off" id="live"><i></i><span>연결 중</span></span>
  </header>
  <div id="err"></div>
  <div id="feed"></div>
  <div id="working"></div>
  <form id="composer">
    <div id="mention" hidden></div>
    <textarea id="input" placeholder="메시지를 입력하세요.  @이름 으로 에이전트를 부릅니다.  (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
    <button type="submit" id="send">보내기</button>
  </form>
</main>

<div class="board" id="board"></div>

<script>
const $ = (s) => document.querySelector(s);
const WS = "ws_demo";
const COLS = [
  ["todo", "할 일", "var(--todo)"],
  ["in_progress", "진행 중", "var(--progress)"],
  ["in_review", "검토 요청", "var(--review)"],
  ["done", "완료", "var(--done)"],
];

let channel = null, human = null, seen = new Set(), es = null, agents = [];
let members = [];               // 자동완성 후보
let mentionState = null;        // { at, q, list, idx } | null

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const time = (t) => new Date(t * 1000).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
function fail(msg) { $("#err").innerHTML = `<div class="err">${esc(msg)}</div>`; }

function renderText(t) {
  return esc(t).replace(/@([A-Za-z0-9_\-가-힣]{1,40})/g, '<span class="mention">@$1</span>');
}

function addMessage(m, animate) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  const feed = $("#feed");
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
  const el = document.createElement("div");
  const isThread = !!m.thread_id;
  el.className = `msg ${isThread ? "thr" : "d" + Math.min(m.depth, 3)}`;
  const h = hue(m.author_name);
  el.innerHTML = `
    <div class="av" style="background:hsl(${h} 55% 45%)">${esc(m.author_name.slice(0, 1))}</div>
    <div class="bd">
      <div class="hd">
        <span class="who">${esc(m.author_name)}</span>
        <span class="ts">${time(m.created_at)}${m.depth ? ` · ${m.depth}홉` : ""}</span>
      </div>
      <div class="tx">${renderText(m.text)}</div>
    </div>`;
  feed.appendChild(el);
  if (atBottom || animate) feed.scrollTop = feed.scrollHeight;
}

async function loadMessages() {
  const ms = await api(`/api/channels/${channel}/messages?limit=200`);
  $("#feed").innerHTML = ms.length ? "" : '<div class="hint">아직 메시지가 없습니다. 아래에서 <b>@기획자</b> 처럼 불러보세요.</div>';
  seen = new Set();
  ms.forEach((m) => addMessage(m));
  $("#feed").scrollTop = $("#feed").scrollHeight;
}

async function loadMembers() {
  const ms = await api(`/api/channels/${channel}/members`);
  // 에이전트를 먼저 — @멘션의 주 용도다
  members = [...ms].sort((a, b) => (a.type === b.type ? 0 : a.type === "agent" ? -1 : 1));
  $("#members").innerHTML = ms.map((m) => `
    <div class="row" title="${esc(m.role || "")}">
      <span class="dot ${m.type}"></span>
      <span class="nm">${esc(m.name)}</span>
      ${m.type === "agent" ? `<span class="tag">${m.reply_mode === "all" ? "전체" : "@멘션"}</span>` : ""}
    </div>`).join("");
}

async function loadBoard() {
  const b = await api(`/api/channels/${channel}/tasks`);
  $("#board").innerHTML = COLS.map(([key, label, color]) => {
    const items = b[key] || [];
    return `<div class="col">
      <h3><b style="background:${color}"></b>${label}<em>${items.length}</em></h3>
      ${items.length ? items.map((t) => `
        <div class="card">
          <div class="t">${esc(t.title)}</div>
          <div class="m">
            ${t.assignee
              ? `<span class="dot ${t.assignee.type}"></span>${esc(t.assignee.name || "?")}`
              : "<span style='color:var(--faint)'>미배정</span>"}
          </div>
        </div>`).join("") : '<div class="empty">—</div>'}
    </div>`;
  }).join("");
}

async function loadActivity() {
  try {
    const { working } = await api(`/api/channels/${channel}/activity`);
    $("#working").innerHTML = working.map((w) => `
      <span class="chip"><span class="d"><s></s><s></s><s></s></span>
        ${esc(w.name)} 작업 중${w.steps ? ` · ${w.steps}단계` : ""}</span>`).join("");
  } catch (e) { /* 폴링 실패는 조용히 넘긴다 */ }
}

function connect() {
  if (es) es.close();
  es = new EventSource(`/api/channels/${channel}/stream`);
  es.onopen = () => { $("#live").className = "live"; $("#live span").textContent = "실시간"; };
  es.onerror = () => { $("#live").className = "live off"; $("#live span").textContent = "재연결 중"; };
  es.onmessage = (ev) => {
    addMessage(JSON.parse(ev.data), true);
    loadBoard(); loadActivity();
  };
}

async function selectChannel(c) {
  channel = c.id;
  $("#chName").textContent = "#" + c.name;
  $("#chTopic").textContent = c.topic || "";
  document.querySelectorAll("#channels .row").forEach((r) =>
    r.classList.toggle("on", r.dataset.id === c.id));
  await Promise.all([loadMessages(), loadMembers(), loadBoard(), loadActivity()]);
  connect();
}

async function boot() {
  try {
    const [channels, agentList] = await Promise.all([
      api(`/api/channels?workspace_id=${WS}`),
      api(`/api/agents?workspace_id=${WS}`),
    ]);
    agents = agentList;
    if (!channels.length) {
      fail("채널이 없습니다.  PYTHONPATH=. .venv/bin/python scripts/seed_api.py  를 먼저 실행하세요.");
      return;
    }
    $("#channels").innerHTML = channels.map((c) =>
      `<div class="row" data-id="${c.id}"><span class="nm"># ${esc(c.name)}</span></div>`).join("");
    channels.forEach((c) => {
      $(`#channels .row[data-id="${c.id}"]`).onclick = () => selectChannel(c);
    });

    // 사람 계정을 하나 확보한다 (없으면 만든다)
    const first = channels[0];
    const members = await api(`/api/channels/${first.id}/members`);
    const me = members.find((m) => m.type === "human");
    human = me || await api("/api/humans", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ workspace_id: WS, name: "나" }),
    });
    await selectChannel(first);
    setInterval(loadActivity, 2500);
  } catch (e) { fail("서버에 연결하지 못했습니다: " + e.message); }
}

// ── @멘션 자동완성 ────────────────────────────────────────────────────
// 한글 IME 주의: 조합 중에는 keydown 의 key 가 'Process' 이거나 keyCode 가 229 로
// 오고, Enter 는 "조합 확정"의 의미다. 이걸 걸러내지 않으면 한글을 치다가
// Enter 로 글자를 확정하는 순간 메시지가 전송되거나 후보가 잘못 선택된다.
const composing = () => $("#input").dataset.composing === "1";

function mentionQuery() {
  const ta = $("#input");
  const pos = ta.selectionStart;
  const before = ta.value.slice(0, pos);
  const at = before.lastIndexOf("@");
  if (at === -1) return null;
  // '@' 앞은 줄 시작이거나 공백이어야 한다 (이메일 주소 등에 반응하지 않도록)
  if (at > 0 && !/[\s(]/.test(before[at - 1])) return null;
  const q = before.slice(at + 1);
  if (/\s/.test(q)) return null;      // 공백이 들어오면 멘션 입력이 끝난 것
  return { at, q };
}

function matchMembers(q) {
  const lower = q.toLowerCase();
  if (!lower) return members;
  const starts = [], contains = [];
  for (const m of members) {
    const n = m.name.toLowerCase();
    if (n.startsWith(lower)) starts.push(m);
    else if (n.includes(lower)) contains.push(m);
  }
  return [...starts, ...contains];
}

function renderMention() {
  const box = $("#mention");
  if (!mentionState) { box.hidden = true; return; }
  const { list, idx, q } = mentionState;
  box.innerHTML = list.map((m, i) => {
    const hit = m.name.toLowerCase().indexOf(q.toLowerCase());
    const nm = q && hit >= 0
      ? esc(m.name.slice(0, hit)) + "<mark>" + esc(m.name.slice(hit, hit + q.length)) +
        "</mark>" + esc(m.name.slice(hit + q.length))
      : esc(m.name);
    return `<div class="opt ${i === idx ? "sel" : ""}" data-i="${i}">
      <span class="dot ${m.type}"></span><span class="nm">${nm}</span>
      <span class="ro">${esc(m.type === "agent" ? (m.role || "에이전트") : "사람")}</span>
    </div>`;
  }).join("") + '<div class="tip">↑↓ 이동 · Enter/Tab 선택 · Esc 닫기</div>';
  box.hidden = false;
  box.querySelectorAll(".opt").forEach((el) => {
    el.onmousedown = (ev) => { ev.preventDefault(); pickMention(+el.dataset.i); };
    el.onmouseenter = () => { mentionState.idx = +el.dataset.i; renderMention(); };
  });
  const sel = box.querySelector(".opt.sel");
  if (sel) sel.scrollIntoView({ block: "nearest" });
}

function closeMention() { mentionState = null; renderMention(); }

function refreshMention() {
  const found = mentionQuery();
  if (!found || !members.length) { closeMention(); return; }
  const list = matchMembers(found.q);
  if (!list.length) { closeMention(); return; }
  const keep = mentionState && mentionState.list[mentionState.idx];
  const idx = keep ? Math.max(0, list.findIndex((m) => m.id === keep.id)) : 0;
  mentionState = { ...found, list, idx };
  renderMention();
}

function pickMention(i) {
  if (!mentionState) return;
  const ta = $("#input");
  const m = mentionState.list[i];
  if (!m) return;
  const tail = ta.value.slice(ta.selectionStart);
  ta.value = ta.value.slice(0, mentionState.at) + "@" + m.name + " " + tail;
  const caret = mentionState.at + m.name.length + 2;
  ta.setSelectionRange(caret, caret);
  closeMention();
  ta.focus();
}

$("#input").addEventListener("compositionstart", (e) => {
  e.target.dataset.composing = "1";
});
$("#input").addEventListener("compositionend", (e) => {
  e.target.dataset.composing = "0";
  refreshMention();          // 조합이 끝난 글자로 다시 필터링
});
$("#input").addEventListener("input", () => { if (!composing()) refreshMention(); });
$("#input").addEventListener("click", refreshMention);
$("#input").addEventListener("blur", () => setTimeout(closeMention, 120));

$("#composer").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("#input").value.trim();
  if (!text || !channel) return;
  $("#send").disabled = true;
  try {
    await api(`/api/channels/${channel}/messages`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ author_id: human.id, author_name: human.name, text }),
    });
    $("#input").value = "";
    closeMention();
    setTimeout(loadActivity, 400);
  } catch (err) { fail("전송 실패: " + err.message); }
  $("#send").disabled = false;
  $("#input").focus();
};

$("#input").onkeydown = (e) => {
  // 한글 조합 중 Enter 는 "글자 확정"이다. 여기서 걸러내지 않으면
  // 한글을 치다가 Enter 로 확정하는 순간 메시지가 전송된다.
  if (e.isComposing || e.keyCode === 229 || composing()) return;

  if (mentionState) {
    const n = mentionState.list.length;
    if (e.key === "ArrowDown") {
      e.preventDefault(); mentionState.idx = (mentionState.idx + 1) % n; renderMention(); return;
    }
    if (e.key === "ArrowUp") {
      e.preventDefault(); mentionState.idx = (mentionState.idx - 1 + n) % n; renderMention(); return;
    }
    if (e.key === "Enter" || e.key === "Tab") {
      e.preventDefault(); pickMention(mentionState.idx); return;
    }
    if (e.key === "Escape") { e.preventDefault(); closeMention(); return; }
  }

  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); }
};

boot();
</script>
</body>
</html>
